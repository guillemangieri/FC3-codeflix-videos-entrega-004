input {
  beats {
    port => 5044
  }
}

filter {
  if [docker][container][labels][com_docker_compose_service] {
    mutate {
      add_field => { "[service][name]" => "%{[docker][container][labels][com_docker_compose_service]}" }
    }
  }
}

output {
  elasticsearch {
    hosts => ["http://elasticsearch:9200"]
  }
}
